name: Release Kor

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      extended_stress:
        description: Run the larger native storage stress profile
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build Python wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.20.0"

      - name: Build CPython wheels
        run: python -m cibuildwheel --output-dir wheelhouse .
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_BEFORE_ALL_LINUX: "yum install -y gcc-toolset-13-gcc-c++ || true"
          CIBW_ENVIRONMENT_LINUX: 'PATH="/opt/rh/gcc-toolset-13/root/usr/bin:$PATH" CC="/opt/rh/gcc-toolset-13/root/usr/bin/gcc" CXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++"'
          CIBW_TEST_REQUIRES: "pytest>=8"
          CIBW_TEST_COMMAND: "python -m pytest {project}/tests/python -v --tb=short --override-ini=testpaths="

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kor-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kor-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  native_tests:
    name: Native C++ tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure native test build
        run: cmake -S . -B "${{ runner.temp }}/kor-cpp-build" -DKOR_BUILD_PYTHON_EXTENSION=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        run: cmake --build "${{ runner.temp }}/kor-cpp-build" --parallel 2

      - name: Run native tests
        run: ctest --test-dir "${{ runner.temp }}/kor-cpp-build" --output-on-failure

  extended_stress:
    if: github.event_name == 'workflow_dispatch' && inputs.extended_stress
    name: Extended native storage stress
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run extended storage profile
        env:
          KOR_STRESS_PROFILE: extended
        run: python -m pytest tests/python/test_stress_profile.py -q

  validate:
    name: Validate release distributions
    needs: [build_wheels, build_sdist, native_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: kor-sdist
          path: dist

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: kor-wheels-*
          path: dist/wheels
          merge-multiple: true

      - name: Build a wheel from the source distribution
        run: |
          mkdir -p dist/from-sdist
          python -m pip wheel --no-deps --wheel-dir dist/from-sdist dist/*.tar.gz

      - name: Test the wheel built from the source distribution
        shell: bash
        run: |
          python -m pip install pytest dist/from-sdist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests/python" -q

      - name: Inspect release artifacts
        shell: bash
        run: |
          args=(--sdist dist/*.tar.gz)
          for wheel in dist/wheels/*.whl dist/from-sdist/*.whl; do
            args+=(--wheel "$wheel")
          done
          python tools/check_dist.py "${args[@]}"

      - name: Generate SHA-256 checksums
        run: |
          mkdir -p release-dist
          cp dist/*.tar.gz dist/wheels/*.whl release-dist/
          sha256sum release-dist/* > "${{ runner.temp }}/SHA256SUMS.txt"

      - name: Upload validated release distributions
        uses: actions/upload-artifact@v4
        with:
          name: kor-release-dist
          path: release-dist/
          if-no-files-found: error

      - name: Upload release checksums
        uses: actions/upload-artifact@v4
        with:
          name: kor-release-checksums
          path: ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error


  build_cpp:
    name: Build C++ library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKOR_BUILD_PYTHON_EXTENSION=OFF -DBUILD_TESTING=OFF

      - name: Build C++ library
        run: cmake --build build --config Release

      - name: Package library (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p kor-cpp-${{ runner.os }}
          find build -type f \( -name "libkor_engine.*" -o -name "libkor_engine.a" \) -exec cp {} kor-cpp-${{ runner.os }}/ \; 2>/dev/null || true
          cp -r include kor-cpp-${{ runner.os }}/
          tar -czvf kor-cpp-${{ runner.os }}.tar.gz kor-cpp-${{ runner.os }}

      - name: Package library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path kor-cpp-Windows
          Get-ChildItem -Path build -Recurse -File -Include kor_engine.lib, kor_engine.dll | ForEach-Object { Copy-Item $_.FullName kor-cpp-Windows/ }
          Copy-Item -Recurse include kor-cpp-Windows/
          Compress-Archive -Force -Path kor-cpp-Windows -DestinationPath kor-cpp-Windows.zip

      - name: Upload C++ artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: kor-cpp-${{ runner.os }}
          path: |
            kor-cpp-*.tar.gz
            kor-cpp-*.zip
          if-no-files-found: ignore

      - name: Attach C++ artifacts to GitHub release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kor-cpp-*.tar.gz
            kor-cpp-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_pypi:
    if: github.event_name == 'release' && github.event.action == 'published' && startsWith(github.ref, 'refs/tags/v')
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kor-db/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: kor-release-dist
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
